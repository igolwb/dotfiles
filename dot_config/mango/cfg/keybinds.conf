bind = SUPER, y, reload_config

# ----------------------------------------------------------------
# Window focus
# ----------------------------------------------------------------
# Arrow keys
bind = SUPER, Left, focusdir, left
bind = SUPER, Down, focusdir, down
bind = SUPER, Up, focusdir, up
bind = SUPER, Right, focusdir, right

# hjkl
bind = SUPER, h, focusdir, left
bind = SUPER, j, focusdir, down
bind = SUPER, k, focusdir, up
bind = SUPER, l, focusdir, right

# ----------------------------------------------------------------
# Move windows (within the layout)
# ----------------------------------------------------------------
# Arrow keys
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Right, exchange_client, right

# hjkl
bind = SUPER+SHIFT, h, exchange_client, left
bind = SUPER+SHIFT, j, exchange_client, down
bind = SUPER+SHIFT, k, exchange_client, up
bind = SUPER+SHIFT, l, exchange_client, right

# ----------------------------------------------------------------
# Move windows between monitors
# ----------------------------------------------------------------

axisbind = SUPER+SHIFT, UP, tagmon, right
axisbind = SUPER+SHIFT, DOWN, tagmon, left

# ----------------------------------------------------------------
# Move windows to adjacent tags (workspaces)
# ----------------------------------------------------------------
bind = SUPER+CTRL+SHIFT, Left, tagtoleft
bind = SUPER+CTRL+SHIFT, Right, tagtoright
bind = SUPER+CTRL+SHIFT, h, tagtoleft
bind = SUPER+CTRL+SHIFT, l, tagtoright

axisbind = SUPER+CTRL+SHIFT, UP, tagtoright
axisbind = SUPER+CTRL+SHIFT, DOWN, tagtoleft

# ----------------------------------------------------------------
# Switch to adjacent tags (workspaces)
# ----------------------------------------------------------------
# "have_client" skips empty tags, matching Hyprland's m-1 / m+1
bind = SUPER+CTRL, Left, viewtoleft_have_client
bind = SUPER+CTRL, Right, viewtoright_have_client
bind = SUPER+CTRL, h, viewtoleft_have_client
bind = SUPER+CTRL, l, viewtoright_have_client

# NOTE: Hyprland's "jump to next empty workspace" (SUPER+CTRL+Down / J)
# has no MangoWM equivalent and was left out.

# Scroll through tags
axisbind = SUPER, DOWN, viewtoright_have_client
axisbind = SUPER, UP, viewtoleft_have_client
axisbind = SUPER+CTRL, DOWN, viewtoleft_have_client
axisbind = SUPER+CTRL, UP, viewtoright_have_client

# ----------------------------------------------------------------
# Switch to / move to tags with number keys
# ----------------------------------------------------------------
# MangoWM tags are per-monitor, so the Hyprland SUPER+CTRL+N
# ("workspace N on this monitor") is the same as SUPER+N here.
# MangoWM supports tags 1-9, so Hyprland's key 0 (workspace 10) is dropped.
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# ----------------------------------------------------------------
# Window management
# ----------------------------------------------------------------
bind = SUPER, q, killclient,

# Toggle floating.
# NOTE: the Lua version also resized the window to 70% of the monitor and
# centered it. Do that with a MangoWM window rule / float size setting in
# your main config, since a bind can't compute it.
bind = SUPER, s, togglefloating,

# Fullscreen
# SUPER+F was layout-aware in Hyprland (fullscreen in most layouts, column
# width toggle in scrolling). MangoWM can't branch on layout, so the two
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,

# Scroller column width.
# Needs something like this in your main config:
#   scroller_proportion_preset = 0.5,1.0
bind = SUPER, r, switch_proportion_preset,

# Move / resize with the mouse
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

# Resize with the keyboard
bind = SUPER+SHIFT, equal, resizewin, +10, +0
bind = SUPER+SHIFT, minus, resizewin, -10, +0
bind = SUPER, equal, resizewin, +0, +10
bind = SUPER, minus, resizewin, +0, -10

# Cycle layouts (was: scrolling -> grid -> dwindle).
# Needs something like this in your main config:
#   circle_layout = scroller,grid,tile
bind = SUPER, Tab, toggleoverview
bind = SUPER, SHIFT, Tab, switch_layout

# ----------------------------------------------------------------
# Launchers
# ----------------------------------------------------------------
bind = SUPER, t, spawn, foot 
bind = SUPER, d, spawn, foot -e yazi
bind = SUPER, e, spawn, zeditor
bind = SUPER, w, spawn, zen-browser 
bind = CTRL+SHIFT, Escape, spawn foot -e btop

# Noctalia
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, b, spawn, noctalia msg bar-toggle
bind = SUPER, x, spawn, noctalia msg panel-toggle control-center
bind = SUPER, n, spawn, noctalia msg panel-toggle control-center notifications
bind = SUPER, v, spawn, noctalia msg panel-toggle control-center audio
bind = SUPER+ALT, c, spawn, noctalia msg panel-toggle session
bind = SUPER, z, spawn, noctalia msg settings-toggle

bind = ALT, Tab, spawn, noctalia msg window-switcher

# ----------------------------------------------------------------
# Utilities
# ----------------------------------------------------------------
# Screenshot
bind = SUPER, p, spawn, noctalia msg screenshot-region

# Theming and wallpaper
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle launcher /wall
bind = SUPER+SHIFT, x, spawn, noctalia msg wallpaper-random

# Clipboard
bind = SUPER, c, spawn, noctalia msg panel-toggle clipboard


# ----------------------------------------------------------------
# Media and brightness
# ----------------------------------------------------------------
# bindl = also works while the screen is locked (Hyprland's "locked = true")
bindl = SUPER, a, spawn, noctalia msg media toggle
bindl = NONE, XF86AudioPlay, spawn, noctalia msg media toggle
bindl = NONE, XF86AudioPause, spawn, noctalia msg media toggle
bindl = NONE, XF86AudioNext, spawn, noctalia msg media next
bindl = NONE, XF86AudioPrev, spawn, noctalia msg media previous

# Brightness (holding the key repeats via normal key repeat)
bindl = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bindl = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down
bindl = SUPER+CTRL, equal, spawn, noctalia msg brightness-up
bindl = SUPER+CTRL, minus, spawn, noctalia msg brightness-down
